services:
  db:
    image: postgres:16-alpine
    container_name: contributions-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contrib_user
      POSTGRES_PASSWORD: contrib_pass
      POSTGRES_DB: contributions
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contrib_user -d contributions"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: contributions-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside Compose the database host is the service name "db", not localhost
      DATABASE_URL: postgres://contrib_user:contrib_pass@db:5432/contributions
      DATABASE_SSL: "false"
    ports:
      - "3000:3000"

volumes:
  pgdata:
